name: database-lab

services:

  mariadb:
    image: mariadb:11.4
    container_name: mariadb-lab
    env_file:
      - ../../mariadb/.env
    environment:
      TZ: UTC
    ports:
      - "3307:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
      - ../../mariadb/my.cnf:/etc/mysql/conf.d/project.cnf:ro
      - ../../mariadb/init:/docker-entrypoint-initdb.d:ro
    networks:
      - database-network
    restart: unless-stopped

  mongodb:
    image: mongo:8.0
    container_name: mongodb-lab
    env_file:
      - ../../mongodb/.env
    environment:
      TZ: UTC
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - database-network
    restart: unless-stopped

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql-lab
    env_file:
      - ../../mssql/.env
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    networks:
      - database-network
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: mysql-lab
    env_file:
      - ../../mysql/.env
    environment:
      TZ: UTC
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../../mysql/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
    networks:
      - database-network
    restart: unless-stopped

  postgres:
    image: postgres:17
    container_name: postgres-lab
    env_file:
      - ../../postgres/.env
    environment:
      TZ: UTC
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    networks:
      - database-network
    restart: unless-stopped

  redis:
    image: redis:7.4
    container_name: redis-lab
    env_file:
      - ../../redis/.env
    environment:
      TZ: UTC
    command:
      - sh
      - -c
      - 'exec redis-server --requirepass "$$REDIS_PASSWORD"'
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    networks:
      - database-network
    restart: unless-stopped


volumes:
  mariadb-data:
  mongodb-data:
  mssql-data:
  mysql-data:
  postgres-data:
  redis-data:


networks:
  database-network:
    driver: bridge
